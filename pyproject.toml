[project]
name = "octov"
version = "0.1.0"
description = "OctoV - Windows Binary Analysis Workbench for Defensive Security Operations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "OctoV contributors" }]
keywords = ["dfir", "malware-analysis", "detection-engineering", "pe", "yara", "sigma"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pefile>=2023.2.7",
    "lief>=0.15",
    "capstone>=5.0",
    "numpy>=1.26",
    "msgpack>=1.0",
    "pyyaml>=6.0",
    "pywebview>=6.2.1",
    "pyzipper>=0.3.6",
]

[project.optional-dependencies]
# Dynamic analysis (M3). Pinned to Frida 16.x per project decision.
dynamic = ["frida>=16.5,<17", "frida-tools>=12,<14"]

[project.scripts]
octov = "octov.cli.main:main"

[project.gui-scripts]
octov-gui = "octov.app.desktop:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML",
    "mkdocs-material>=9.5",
    "yara-python>=4.5.4",
    "pysigma>=2.0.2",
    "nodejs-wheel-binaries>=24.19.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octov"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
allowed-confusables = ["ı"]  # Azerbaijani dotless i

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["octov"]

[[tool.mypy.overrides]]
module = ["pefile", "msgpack", "capstone", "lief", "lief.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
